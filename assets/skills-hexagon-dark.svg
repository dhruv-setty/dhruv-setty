<style>.area{transform-origin:490.0px 326.0px;animation:grow 1.4s cubic-bezier(.2,.8,.2,1) both, breathe 4s ease-in-out 1.4s infinite}@keyframes grow{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}.sweep{transform-origin:490.0px 326.0px;animation:spin 6s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.dot{opacity:0;animation:pop .4s ease-out both, pulse 3s ease-in-out infinite}@keyframes pop{from{opacity:0}to{opacity:1}}@keyframes pulse{0%,100%{stroke-width:2}50%{stroke-width:4}}.lbl{opacity:0;animation:fade .6s ease-out both}@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}@media (prefers-reduced-motion: reduce){.area,.sweep,.dot,.lbl{animation:none;opacity:1}}</style>
